# 我们自己的 rust bootstrap 配置：在设备上**原生**构建 rustc
# host == target == aarch64-linux-android，stage0 用已装的 rustc（同版本 1.100.0-nightly）。
# 与 Termux 官方 bootstrap.toml 的差别（都是因为我们是原生构建而非 x86_64 用 NDK 交叉）：
#   * 不用 @CARGO_TARGET_NAME@/@RUSTC@ 占位符，路径写死（本机固定）
#   * 不设 [build] android-ndk（原生构建没有 NDK）
#   * llvm-config 指向**树 C**（23.1.3 PGO）：$PREFIX/bin/llvm-config 是 23.1.0-rc1 的旧物，
#     与已装 rustc 的 "LLVM version: 23.1.3" 对不上
#   * linker 走我们自己的 clang（可用 LINKER=mold|lld 切换，见 build-rust.sh）
change-id = "ignore"

profile = "dist"

[llvm]
download-ci-llvm = false
link-shared = true

[build]
build = "aarch64-linux-android"
host = ["aarch64-linux-android"]
target = ["aarch64-linux-android"]
rustc = "/data/data/com.termux/files/usr/bin/rustc"
cargo = "/data/data/com.termux/files/usr/bin/cargo"
python = "python3"
extended = true
tools = ["cargo", "rustdoc", "rustfmt", "src"]
sanitizers = false
# 不用 jemalloc（Termux 下用系统分配器）；rust.jemalloc 已弃用，按提示写在这里
allocator = "system"

[install]
prefix = "/data/data/com.termux/files/home/rust-stage2-prefix"
sysconfdir = "etc"
docdir = "share/doc/rust"

[rust]
optimize = true
debug = false
codegen-units = 0
channel = "nightly"
rpath = false
lld = false

[target.aarch64-linux-android]
llvm-config = "/data/data/com.termux/files/home/llvm-termux/build-pgouse/bin/llvm-config"
# cc/cxx/linker 走 wrapper：把 --target=aarch64-linux-android 提为 -android30，
# 与按 API 30 构建的 libc++ 头文件对齐（否则 condition_variable 等头会引用
# bionic 在低 API 下未声明的 pthread_cond_clockwait）。
cc = "/data/data/com.termux/files/home/termux-llvm-rust-mold/packaging/clang-api30.sh"
cxx = "/data/data/com.termux/files/home/termux-llvm-rust-mold/packaging/clangxx-api30.sh"
linker = "/data/data/com.termux/files/home/termux-llvm-rust-mold/packaging/clang-api30.sh"
ar = "/data/data/com.termux/files/usr/bin/llvm-ar"
ranlib = "/data/data/com.termux/files/usr/bin/llvm-ranlib"
profiler = true

[dist]
src-tarball = false
compression-formats = ["gz"]
